# Tests the server, then builds the Android and iOS apps. No Mac needed: iOS builds on GitHub's macOS machines.
# Set the repository variable SERVER_URL (Settings > Secrets and variables > Actions > Variables)
# once the server is online; until then the apps point at a placeholder and only solo works.
name: apps

on:
  push:
    paths: ['app/**', '.github/workflows/apps.yml']
  workflow_dispatch:

env:
  SERVER_URL: ${{ vars.SERVER_URL || 'https://sudoku-battles.invalid' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: app/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-battles-android-debug
          path: app/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: test
    runs-on: macos-latest
    defaults: { run: { working-directory: app/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
